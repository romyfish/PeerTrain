{% if messages %}
  <div
    class="peertrain-toast-region"
    aria-live="polite"
    aria-atomic="true"
    aria-label="Success notifications"
  >
    {% for message in messages %}
      {% if "success" in message.tags %}
        <div
          class="toast peertrain-success-toast"
          role="status"
          aria-live="polite"
          aria-atomic="true"
          data-peertrain-success-toast
          data-bs-autohide="true"
          data-bs-delay="4500"
        >
          <div class="d-flex align-items-center">
            <span class="peertrain-success-toast-icon" aria-hidden="true">
              <i class="bi bi-check-lg"></i>
            </span>
            <div class="toast-body">{{ message }}</div>
            <button
              type="button"
              class="btn-close me-3"
              data-bs-dismiss="toast"
              aria-label="Close notification"
            ></button>
          </div>
        </div>
      {% endif %}
    {% endfor %}
  </div>

  <div class="peertrain-flash-stack">
    {% for message in messages %}
      {% if "success" not in message.tags %}
        <div class="alert alert-{{ message.tags|default:'info' }} rounded-4 border-0 shadow-sm mb-3">
          {{ message }}
        </div>
      {% endif %}
    {% endfor %}
  </div>
{% endif %}
