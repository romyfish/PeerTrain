{% load assessment_ui %}
{% if example.better_reply %}
<aside class="review-alternative" data-review-message="{{ example.message_id }}">
  <strong>An alternative reply to consider</strong>
  <p><q><em>{{ example.better_reply|linebreaksbr }}</em></q></p>
  {% if example.why_it_matters %}<p>{{ example.why_it_matters|boundary_highlights }}</p>{% endif %}
</aside>
{% endif %}
